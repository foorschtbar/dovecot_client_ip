name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '5.6'
          - '7.4'
          - '8.1'
          - '8.4'

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint
        run: |
          php -l CIDR.php
          php -l dovecot_client_ip.php
          php -l tests/run.php
      - name: Test
        run: php tests/run.php
